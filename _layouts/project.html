---
layout: default
---
<article class="project">
  <header class="project-header">
    <p class="project-eyebrow"><a href="{{ "/work/" | relative_url }}">&larr; Back to work</a></p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="project-summary">{{ page.summary }}</p>{% endif %}
    {% if page.tools %}
    <ul class="tag-list">
      {% for tool in page.tools %}<li>{{ tool }}</li>{% endfor %}
    </ul>
    {% endif %}
    {% if page.repo %}
    <p class="project-repo"><a href="{{ page.repo }}" target="_blank" rel="noopener">Source on GitHub &rarr;</a></p>
    {% endif %}
  </header>

  <div class="project-body">
    {{ content }}
  </div>
</article>
