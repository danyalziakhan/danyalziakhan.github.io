<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>
      // Applied before first paint so the correct theme renders immediately.
      (function () {
        // No stored choice means the OS setting governs, via prefers-color-scheme.
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet">

    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/images/favicon-32.png" | relative_url }}">
    <link rel="apple-touch-icon" href="{{ "/assets/images/apple-touch-icon.png" | relative_url }}">
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="site-header-inner">
          <a class="site-brand" href="{{ "/" | relative_url }}">Danyal Zia Khan</a>

          <nav class="site-nav">
            {% for link in site.navigation %}
            <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
            {% endfor %}

            <button class="nav-btn search-open" type="button" aria-label="Search">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <span class="search-label">Search</span>
              <span class="search-hint">Ctrl K</span>
            </button>

            <button class="nav-btn theme-toggle" type="button" title="Theme" aria-label="Change theme">
              <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.7 14.6A8.6 8.6 0 0 1 9.4 3.3a8.6 8.6 0 1 0 11.3 11.3z"/></svg>
            </button>

            <a class="nav-icon" href="{{ site.social.github }}" target="_blank" rel="noopener" aria-label="GitHub profile" title="GitHub">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
            </a>
          </nav>
        </div>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="site-footer-inner">
          <p>Danyal Zia Khan &middot; Copyright {{ site.time | date: "%Y" }}</p>
          <div class="footer-links">
            <a href="mailto:{{ site.email }}">Email</a>
            <a href="{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>
            <a href="{{ site.social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
            <a href="{{ site.social.fiverr }}" target="_blank" rel="noopener">Fiverr</a>
          </div>
        </div>
      </footer>
    </div>

    <div class="search-overlay" hidden>
      <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search this site">
        <input class="search-input" type="search" placeholder="Search this site" autocomplete="off" spellcheck="false">
        <ul class="search-results"></ul>
        <p class="search-empty" hidden>No matches.</p>
      </div>
    </div>

    <script src="{{ "/assets/js/site.js" | relative_url }}" defer></script>
  </body>
</html>
